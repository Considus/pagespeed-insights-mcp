version: 2
updates:
  # The package is standard-library-only, so there is no Python manifest to
  # track. The one thing here with pinned versions is the CI workflow's
  # actions — keep those current, and their commit-SHA pins refreshed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
