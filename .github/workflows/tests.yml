name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported (macOS system Python). The package is
        # stdlib-only, so there is no install step on any of them.
        #
        # Windows is in the matrix deliberately. Dropping the service-account
        # credential was what made this package installable there without a
        # compiled dependency, and a test run that never touches Windows would
        # let that quietly regress.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q pagespeed_insights setup.py mcp_server.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
